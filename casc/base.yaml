jenkins:
  systemMessage: "Ceph Jenkins Controller"
  numExecutors: 0
  mode: EXCLUSIVE

  # Security configuration
  securityRealm:
    local:
      allowsSignup: false
      users:
        - id: "admin"

  # Authorization configuration
  authorizationStrategy:
    globalMatrix:
      entries:
        - user:
            name: "admin"
            permissions:
              - "Overall/Administer"
        - user:
            name: "anonymous"
            permissions:
              - "Overall/Read"

  globalNodeProperties:
    - envVars:
        env:
          - key: "PULP_PROJECT_REPO"
            value: "https://github.com/vamahaja/pulp-project.git"
          - key: "SHAMAN_CEPH_REPO_URL"
            value: "https://shaman.ceph.com/r/ceph"
          - key: "SHARED_WORKSPACE"
            value: "/home/jenkins/workspace"

security:
  # Enforce Content Security Policy
  contentSecurityPolicy:
    enforce: true
  globalJobDslSecurityConfiguration:
    # Allow Job DSL to run without manual script approval.
    useScriptSecurity: false
  scriptApproval:
    # Allow the specific DSL scripts to bypass the sandbox.
    approvedSignatures:
      - "method javaposse.jobdsl.dsl.DslFactory job java.lang.String"
      - "method javaposse.jobdsl.dsl.Job scm(groovy.lang.Closure)"

# Console color configuration
unclassified:
  ansiColorBuildWrapper:
    globalColorMapName: "xterm"
  # Shared library (repo-root vars/) for helpers (ceph.*, pulp.*, artifacts.*, containers.*, nix.*).
  globalLibraries:
    libraries:
      - name: "ceph-jenkins"
        defaultVersion: "main"
        implicit: false
        allowVersionOverride: true
        includeInChangesets: false
        retriever:
          modernSCM:
            scm:
              git:
                remote: "https://github.com/vamahaja/ceph-jenkins.git"
                traits:
                  - "gitBranchDiscovery"

# Pipeline Graph View configuration
appearance:
  pipelineGraphView:
    showGraphOnBuildPage: true
    showGraphOnJobPage: true
    showStageDurations: true
    showStageNames: true

# Seeder job
jobs:
  - file: "/var/jenkins_home/seed.groovy"
