# OpenShift/Kubernetes cloud agents (in-cluster).
#
# Helm substitutes release-scoped placeholders for namespace, Service name,
# ServiceAccount, shared-workspace PVC claim, agent image prefix/tag, and optional pull secrets.
#
# Templates use a jnlp remoting sidecar plus a builder tools container. Shell steps
# default to jnlp; pipelines/shared-lib helpers must use container('builder') for
# Nix and build tools. (agentInjection is unsuitable here: its set-up-jenkins-agent
# init container has no resources and fails ResourceQuota in this cluster.)
#
# jnlp workingDir is /tmp because OpenShift assigns a random UID;
# jenkins/inbound-agent's /home/jenkins is mode 700 so paths under it are
# unreachable. Mount the shared-workspace PVC at /workspace (not under
# /home/jenkins) so jnlp FilePath ops (checkout) and builder steps can both write.
jenkins:
  clouds:
    - kubernetes:
        name: "openshift"
        namespace: "__JENKINS_NAMESPACE__"
        # Empty serverUrl uses the in-cluster Kubernetes API.
        jenkinsUrl: "http://__JENKINS_SERVICE__:8080/"
        jenkinsTunnel: "__JENKINS_SERVICE__:50000"
        containerCap: 10
        templates:
          - name: "ceph-seed-agent"
            label: "ceph-seed-agent"
            serviceAccount: "__JENKINS_SERVICE_ACCOUNT__"
            __AGENT_IMAGE_PULL_SECRETS__
            containers:
              - name: "jnlp"
                image: "jenkins/inbound-agent:latest"
                workingDir: "/tmp"
                resourceRequestCpu: "100m"
                resourceLimitCpu: "500m"
                resourceRequestMemory: "256Mi"
                resourceLimitMemory: "512Mi"
              - name: "builder"
                image: "__AGENT_IMAGE_PREFIX__ceph-jenkins-seed-agent:__AGENT_IMAGE_TAG__"
                workingDir: "/tmp"
                ttyEnabled: true
                command: "sleep"
                args: "99d"
                resourceRequestCpu: "100m"
                resourceLimitCpu: "500m"
                resourceRequestMemory: "256Mi"
                resourceLimitMemory: "512Mi"
          - name: "ceph-build-fedora39-agent"
            label: "ceph-build-fedora39-agent"
            serviceAccount: "__JENKINS_SERVICE_ACCOUNT__"
            __AGENT_IMAGE_PULL_SECRETS__
            containers:
              - name: "jnlp"
                image: "jenkins/inbound-agent:latest"
                workingDir: "/tmp"
                resourceRequestCpu: "100m"
                resourceLimitCpu: "500m"
                resourceRequestMemory: "256Mi"
                resourceLimitMemory: "512Mi"
              - name: "builder"
                image: "__AGENT_IMAGE_PREFIX__ceph-jenkins-fedora39-agent:__AGENT_IMAGE_TAG__"
                workingDir: "/workspace"
                ttyEnabled: true
                command: "sleep"
                args: "99d"
                resourceRequestCpu: "2"
                resourceLimitCpu: "4"
                resourceRequestMemory: "4Gi"
                resourceLimitMemory: "16Gi"
                envVars:
                  - envVar:
                      key: "HOME"
                      value: "/workspace"
                  - envVar:
                      key: "ALLOCATED_CPUS"
                      value: "4"
            volumes:
              - persistentVolumeClaim:
                  claimName: "__SHARED_WORKSPACE_CLAIM__"
                  mountPath: "/workspace"
                  readOnly: false
          - name: "ceph-build-centos9-agent"
            label: "ceph-build-centos9-agent"
            serviceAccount: "__JENKINS_SERVICE_ACCOUNT__"
            __AGENT_IMAGE_PULL_SECRETS__
            containers:
              - name: "jnlp"
                image: "jenkins/inbound-agent:latest"
                workingDir: "/tmp"
                resourceRequestCpu: "100m"
                resourceLimitCpu: "500m"
                resourceRequestMemory: "256Mi"
                resourceLimitMemory: "512Mi"
              - name: "builder"
                image: "__AGENT_IMAGE_PREFIX__ceph-jenkins-centos9-agent:__AGENT_IMAGE_TAG__"
                workingDir: "/workspace"
                ttyEnabled: true
                privileged: true
                command: "sleep"
                args: "99d"
                resourceRequestCpu: "2"
                resourceLimitCpu: "4"
                resourceRequestMemory: "4Gi"
                resourceLimitMemory: "16Gi"
                envVars:
                  - envVar:
                      key: "HOME"
                      value: "/workspace"
                  - envVar:
                      key: "ALLOCATED_CPUS"
                      value: "4"
            volumes:
              - persistentVolumeClaim:
                  claimName: "__SHARED_WORKSPACE_CLAIM__"
                  mountPath: "/workspace"
                  readOnly: false
          - name: "ceph-build-rocky10-agent"
            label: "ceph-build-rocky10-agent"
