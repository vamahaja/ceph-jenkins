# OpenShift/Kubernetes cloud agents (in-cluster).
#
# Helm substitutes release-scoped placeholders for namespace, Service name,
# ServiceAccount, shared-workspace PVC claim, agent image prefix/tag, and optional pull secrets.
#
# Each template is one container named jnlp (the Kubernetes plugin default). The
# image is the distro agent, which has jenkins-agent on PATH; command launches it.
# Shell steps, checkout, and Nix all run in that container. agentInjection is not
# used: its set-up-jenkins-agent init container has no resources and fails
# ResourceQuota in this cluster.
#
# workingDir and HOME are /home/jenkins/workspace. The agent images make
# /home/jenkins mode 755 so a random OpenShift UID can enter it. The plugin
# mounts the workspace volume at workingDir.
# Each build agent gets its own 100Gi ReadWriteOnce volume (dynamicPVC),
# created and deleted with the pod. The seed agent keeps the default emptyDir.
# Distro agents receive the make-dist tarball by stash, not a shared claim.
jenkins:
  clouds:
    - kubernetes:
        name: "openshift"
        namespace: "__JENKINS_NAMESPACE__"
        # Empty serverUrl uses the in-cluster Kubernetes API.
        jenkinsUrl: "http://__JENKINS_SERVICE__:8080/"
        jenkinsTunnel: "__JENKINS_SERVICE__:50000"
        containerCap: 10
        templates:
          - name: "ceph-seed-agent"
            label: "ceph-seed-agent"
            serviceAccount: "__JENKINS_SERVICE_ACCOUNT__"
            __AGENT_IMAGE_PULL_SECRETS__
            containers:
              - name: "jnlp"
                image: "__AGENT_IMAGE_PREFIX__ceph-jenkins-seed-agent:__AGENT_IMAGE_TAG__"
                workingDir: "/home/jenkins/workspace"
                command: "jenkins-agent"
                alwaysPullImage: true
                resourceRequestCpu: "100m"
                resourceLimitCpu: "500m"
                resourceRequestMemory: "256Mi"
                resourceLimitMemory: "512Mi"
                envVars:
                  - envVar:
                      key: "HOME"
                      value: "/home/jenkins/workspace"
          - name: "ceph-build-fedora39-agent"
            label: "ceph-build-fedora39-agent"
            serviceAccount: "__JENKINS_SERVICE_ACCOUNT__"
            __AGENT_IMAGE_PULL_SECRETS__
            workspaceVolume:
              dynamicPVC:
                accessModes: "ReadWriteOnce"
                requestsSize: "100Gi"
            containers:
              - name: "jnlp"
                image: "__AGENT_IMAGE_PREFIX__ceph-jenkins-fedora39-agent:__AGENT_IMAGE_TAG__"
                workingDir: "/home/jenkins/workspace"
                command: "jenkins-agent"
                alwaysPullImage: true
                resourceRequestCpu: "2"
                resourceLimitCpu: "4"
                resourceRequestMemory: "4Gi"
                resourceLimitMemory: "16Gi"
                envVars:
                  - envVar:
                      key: "HOME"
                      value: "/home/jenkins/workspace"
                  - envVar:
                      key: "ALLOCATED_CPUS"
                      value: "4"
          - name: "ceph-build-centos9-agent"
            label: "ceph-build-centos9-agent"
            serviceAccount: "__JENKINS_SERVICE_ACCOUNT__"
            __AGENT_IMAGE_PULL_SECRETS__
