# Podman/Docker cloud agents (requires host podman.sock mounted into the controller).
jenkins:
  clouds:
    - docker:
        name: "podman-cloud"
        containerCap: 10
        dockerApi:
          dockerHost:
            uri: "unix:///var/run/podman.sock"
        templates:
          - name: "ceph-seed-agent"
            labelString: "ceph-seed-agent"
            remoteFs: "/home/jenkins"
            mode: EXCLUSIVE
            pullStrategy: PULL_NEVER
            instanceCapStr: "1"
            dockerTemplateBase:
              image: "ceph-jenkins-seed-agent:latest"
              tty: true
              cpuShares: 256
              memorySwap: 256
              memoryLimit: 256
            connector:
              attach:
                user: "jenkins"
          - name: "ceph-build-fedora39-agent"
            labelString: "ceph-build-fedora39-agent"
            remoteFs: "/home/jenkins"
            mode: EXCLUSIVE
            pullStrategy: PULL_NEVER
            instanceCapStr: "4"
            dockerTemplateBase:
              image: "ceph-jenkins-fedora39-agent:latest"
              tty: true
              cpuShares: 4096
              memoryLimit: 16384
              memorySwap: -1
              environment:
                - "ALLOCATED_CPUS=4"
              mounts:
                - "type=volume,source=jenkins_shared_workspace,destination=/home/jenkins/workspace"
            connector:
              attach:
                user: "jenkins"
          - name: "ceph-build-centos9-agent"
            labelString: "ceph-build-centos9-agent"
            remoteFs: "/home/jenkins"
            mode: EXCLUSIVE
