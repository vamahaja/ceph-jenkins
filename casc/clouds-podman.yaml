# Podman/Docker cloud agents (requires host podman.sock mounted into the controller).
#
# Images include jenkins-agent for the OpenShift cloud. Podman does not run it:
# the attach connector execs its own remoting jar and does not set JENKINS_SECRET.
# Keep image CMD ["/bin/bash"] and tty: true. An entrypoint of jenkins-agent exits
# immediately under this connector. remoteFs stays /home/jenkins (uid 1000);
# do not set HOME=/workspace here. The shared tree is the volume at /workspace.
jenkins:
  clouds:
    - docker:
        name: "podman-cloud"
        containerCap: 10
        dockerApi:
          dockerHost:
            uri: "unix:///var/run/podman.sock"
        templates:
          - name: "ceph-seed-agent"
            labelString: "ceph-seed-agent"
            remoteFs: "/home/jenkins"
            mode: EXCLUSIVE
            pullStrategy: PULL_NEVER
            instanceCapStr: "1"
            dockerTemplateBase:
              image: "ceph-jenkins-seed-agent:latest"
              tty: true
              securityOpts:
                - "label=disable"
              privileged: true
              cpuShares: 512
              # 256Mi OOMs during git clone + remoting; match OpenShift headroom with room to spare.
              memoryLimit: 1024
              memorySwap: -1
            connector:
              attach:
                user: "jenkins"
          - name: "ceph-make-dist-agent"
            labelString: "ceph-make-dist-agent"
            remoteFs: "/home/jenkins"
            mode: EXCLUSIVE
            pullStrategy: PULL_NEVER
            instanceCapStr: "4"
            dockerTemplateBase:
              image: "ceph-jenkins-make-dist-agent:latest"
              tty: true
              securityOpts:
                - "label=disable"
              privileged: true
              cpuShares: 4096
              memoryLimit: 16384
              memorySwap: -1
              environment:
                - "ALLOCATED_CPUS=4"
              mounts:
                - "type=volume,source=jenkins_shared_workspace,destination=/workspace"
            connector:
              attach:
                user: "jenkins"
          - name: "ceph-build-centos9-agent"
            labelString: "ceph-build-centos9-agent"
            remoteFs: "/home/jenkins"
