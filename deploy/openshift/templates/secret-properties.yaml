{{- if not .Values.propertiesExistingSecret }}
{{- if not .Values.propertiesContent }}
{{- fail "Set propertiesContent via --set-file or set propertiesExistingSecret to an existing Secret name" }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "ceph-jenkins.fullname" . }}-properties
  labels:
    {{- include "ceph-jenkins.labels" . | nindent 4 }}
type: Opaque
stringData:
  properties.yaml: |
{{ .Values.propertiesContent | indent 4 }}
{{- end }}
