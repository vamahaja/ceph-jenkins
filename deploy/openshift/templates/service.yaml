apiVersion: v1
kind: Service
metadata:
  name: {{ include "ceph-jenkins.fullname" . }}
  labels:
    {{- include "ceph-jenkins.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: http
      port: {{ .Values.service.httpPort }}
      targetPort: http
      protocol: TCP
    - name: agent-listener
      port: {{ .Values.service.agentPort }}
      targetPort: agent-listener
      protocol: TCP
  selector:
    {{- include "ceph-jenkins.selectorLabels" . | nindent 4 }}
