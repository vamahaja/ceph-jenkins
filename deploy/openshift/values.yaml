# Controller image (push to a registry the cluster can pull)
image:
  repository: ceph-jenkins-controller
  tag: latest
  pullPolicy: IfNotPresent

# Agent images used in casc/clouds-openshift.yaml (Kubernetes cloud templates)
# prefix example: "image-registry.openshift-image-registry.svc:5000/ceph-jenkins/"
# (trailing slash optional; chart normalizes it)
agentImages:
  prefix: ""
  tag: latest
  # Secret names in the release namespace for pulling private agent images
  imagePullSecrets: []

# Also used by the controller Deployment when pulling the controller image
imagePullSecrets: []

nameOverride: ""
fullnameOverride: ""

# Matches Podman deploy JAVA_OPTS
javaOpts: >-
  -Xms4g -Xmx8g
  -XX:+UseG1GC
  -XX:+ExplicitGCInvokesConcurrent
  -Djenkins.install.runSetupWizard=false
  -Djava.awt.headless=true
  -Dcasc.jenkins.config=/var/jenkins_home/casc_configs/

# Matches Podman --cpus 4 / --memory 12g (with 4g reservation as request)
resources:
  requests:
    cpu: "2"
    memory: 4Gi
  limits:
    cpu: "4"
    memory: 12Gi

service:
  type: ClusterIP
  httpPort: 8080
  agentPort: 50000

route:
  enabled: true
  host: ""
  tls:
    enabled: true
    termination: edge
    insecureEdgeTerminationPolicy: Redirect

persistence:
  home:
    enabled: true
    size: 20Gi
    storageClass: ""
    accessModes:
      - ReadWriteOnce
  # Required RWX PVC mounted by build-agent templates at /workspace.
  sharedWorkspace:
    size: 100Gi
    # Must support ReadWriteMany (multi-agent mounts).
    storageClass: ""
    accessModes:
      - ReadWriteMany

# Populate via helm --set-file (see README). Required for install.
cascBaseContent: ""
cascCloudsContent: ""
seedContent: ""

# Prefer an existing Secret for real credentials; otherwise set propertiesContent via --set-file
propertiesExistingSecret: ""
propertiesExistingSecretKey: properties.yaml
propertiesContent: ""

# Require Casc/seed/properties inputs on install. Set false to render a single
# template (e.g. RBAC only) without the rest of the release inputs.
validate: true

# pod: every agent is a Kubernetes pod (casc/clouds-openshift.yaml).
# virt: seed stays a pod; build agents are static VirtualMachines
# (casc/cloud-openshift-virt.yaml). deploy/openshift/deploy-virt.sh sets virt.
agentMode: pod

virtAgents:
  storageClass: ""
  rootDiskSize: 40Gi
  # Separate RBD disk per build VM, mounted at /home/jenkins.
  # Uses virtAgents.storageClass (must support volumeMode: Block).
  homeDiskSize: 300Gi
  cpu: 16
  memory: 64Gi
  # Injected by deploy-virt.sh (--set-file). Required when agentMode is virt.
  sshPublicKey: ""
  # Shared guest helpers from deploy/scripts/ and deploy/virtual-machines/
  # (outside the Helm chart tree; reusable by other VM platforms).
  guestSetupContent: ""
  installNixContent: ""
  packagesRpmContent: ""
  packagesDebContent: ""
  packagesPipContent: ""
  # Map of cloud-init key -> user-data body. Keys match paths under
  # deploy/virtual-machines/agents/ with "/" replaced by "-"
  # (e.g. centos/9.stream -> centos-9.stream).
  cloudInitContent: {}
  # firmwareUUID: stable guest SMBIOS UUID (not cluster-specific). Pinning it keeps
  # cloud-init from treating Helm upgrades/recreates as a new instance. Change the
  # UUID only when you intentionally want cloud-init to re-run on existing disks.
  agents:
    - name: ceph-build-centos9-agent
      cloudInit: centos-9.stream
      firmwareUUID: "7b2e4c10-1a44-4d21-9c01-a10e00000012"
      image: "https://cloud.centos.org/centos/9-stream/x86_64/images/CentOS-Stream-GenericCloud-9-latest.x86_64.qcow2"
      cpu: 16
      memory: 64Gi
    - name: ceph-build-rocky10-agent
      cloudInit: rocky-10
      firmwareUUID: "7b2e4c10-1a44-4d21-9c01-a10e00000013"
      image: "https://dl.rockylinux.org/pub/rocky/10/images/x86_64/Rocky-10-GenericCloud-Base.latest.x86_64.qcow2"
      cpu: 16
      memory: 64Gi
    - name: ceph-build-ubuntu-noble-agent
      cloudInit: ubuntu-noble
      firmwareUUID: "7b2e4c10-1a44-4d21-9c01-a10e00000004"
      image: "https://cloud-images.ubuntu.com/noble/current/noble-server-cloudimg-amd64.img"
      cpu: 16
      memory: 64Gi
    - name: ceph-build-ubuntu-jammy-agent
      cloudInit: ubuntu-jammy
      firmwareUUID: "7b2e4c10-1a44-4d21-9c01-a10e00000005"
      image: "https://cloud-images.ubuntu.com/jammy/current/jammy-server-cloudimg-amd64.img"
      cpu: 16
      memory: 64Gi

serviceAccount:
  create: true
  name: ""
  annotations: {}

# RBAC for Kubernetes plugin to provision agent pods
rbac:
  create: true

podAnnotations: {}

# Leave empty for OpenShift restricted-v2 (avoid hardcoded fsGroup: 1000).
# OpenShift assigns an allowed UID/GID range from the namespace.
podSecurityContext: {}

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  runAsNonRoot: true

nodeSelector: {}
tolerations: []
affinity: {}

# TCP probes on port 8080 (/login may return 403, which fails httpGet)
probes:
  liveness:
    initialDelaySeconds: 60
    periodSeconds: 30
    timeoutSeconds: 5
    failureThreshold: 5
  readiness:
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 6
